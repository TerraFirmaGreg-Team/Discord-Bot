plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version "${shadowPluginVersion}"
}

group = "${projectGroup}"
version = "${projectVersion}"


java {
    sourceCompatibility = JavaVersion.toVersion("${javaVersion}")
    targetCompatibility = JavaVersion.toVersion("${javaVersion}")
}

repositories {
    mavenCentral()
    maven {
        name = 'dv8tion'
        url = 'https://m2.dv8tion.net/releases'
    }
}

dependencies {
    // JDA - Java Discord API
    implementation "net.dv8tion:JDA:${jdaVersion}"

    // JSoup for HTML parsing
    implementation "org.jsoup:jsoup:${jsoupVersion}"

    // JSON parsing
    implementation "com.google.code.gson:gson:${gsonVersion}"

    implementation "com.electronwill.night-config:toml:${nightconfigVersion}"
    // SLF4J for logging
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

application {
    mainClass = 'team.terrafirmagreg.bot.Main'
}

shadowJar {
    archiveBaseName.set("${projectName}")
    archiveClassifier.set('')
    archiveVersion.set('')

    manifest {
        attributes 'Main-Class': 'team.terrafirmagreg.bot.Main',
                'Implementation-Version': "${projectVersion}"
    }
}

// Отключаем обычный jar task
jar.enabled = false
